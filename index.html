<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데일리 증시 리포트</title>
  <meta property="og:title" content="데일리 증시 리포트" />
  <meta property="og:description" content="매일 업데이트되는 증시 요약 리포트" />
  <style>
    :root {
      --bg: #0f1115;
      --bar: #171a21;
      --text: #e6e8ec;
      --muted: #9aa3af;
      --accent: #f5c542;
      --border: #272b33;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      -webkit-text-size-adjust: 100%;
    }
    /* 상단 바: 컨셉 타이틀 + 날짜 드롭다운 */
    header {
      flex: 0 0 auto;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { font-size: 1.1rem; font-weight: 700; white-space: nowrap; }
    .spacer { flex: 1 1 auto; }
    .picker { display: flex; align-items: center; gap: 8px; }
    .picker label { color: var(--muted); font-size: .85rem; }
    .navlink { color: var(--accent); text-decoration: none; font-size: .9rem; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; white-space: nowrap; }
    .navlink:hover { background: var(--bg); }
    select {
      background: #0f1115;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: .95rem;
      min-width: 160px;
    }
    /* 본문: 선택한 날짜 리포트를 iframe으로 표시 */
    .viewer { flex: 1 1 auto; position: relative; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }
    .state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: .95rem;
      padding: 24px;
      text-align: center;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">📈 데일리 증시 리포트</div>
    <div class="spacer"></div>
    <div class="picker">
      <label for="dateSelect">날짜</label>
      <select id="dateSelect" disabled>
        <option>불러오는 중…</option>
      </select>
    </div>
    <a class="navlink" href="realestate.html">🏢 부동산 실거래</a>
  </header>

  <div class="viewer">
    <iframe id="reportFrame" title="증시 리포트" class="hidden"></iframe>
    <div id="state" class="state">리포트 목록을 불러오는 중…</div>
  </div>

  <script>
    // ===== 설정: 저장소 정보 =====
    const OWNER  = "SongpaCity";
    const REPO   = "daily-stock-report";
    const FOLDER = "DailyReport";
    const BRANCH = "main";

    const selectEl = document.getElementById("dateSelect");
    const frameEl  = document.getElementById("reportFrame");
    const stateEl  = document.getElementById("state");

    // 파일명에서 YYYY-MM-DD 추출 (예: 2026-10-16.html, 증시리포트_2026-10-16.html 모두 지원)
    function extractDate(name) {
      const m = name.match(/(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : null;
    }

    // 날짜에 요일 라벨 붙이기 (예: 2026-10-16 (금))
    function labelFor(dateStr) {
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const d = new Date(dateStr + "T00:00:00");
      return isNaN(d) ? dateStr : `${dateStr} (${days[d.getDay()]})`;
    }

    function showState(msg) {
      stateEl.textContent = msg;
      stateEl.classList.remove("hidden");
      frameEl.classList.add("hidden");
    }

    function loadReport(fileName) {
      frameEl.src = `${FOLDER}/${encodeURIComponent(fileName)}`;
      frameEl.classList.remove("hidden");
      stateEl.classList.add("hidden");
    }

    async function init() {
      try {
        // GitHub 공개 API로 DailyReport 폴더의 파일 목록을 가져온다 (인증 불필요)
        const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
        const res = await fetch(api, { headers: { "Accept": "application/vnd.github+json" } });
        if (!res.ok) throw new Error("API " + res.status);
        const files = await res.json();

        // .html 파일 + 날짜 추출 → 날짜 내림차순 정렬 (최신이 위)
        const items = files
          .filter(f => f.type === "file" && /\.html?$/i.test(f.name))
          .map(f => ({ name: f.name, date: extractDate(f.name) }))
          .filter(f => f.date)
          .sort((a, b) => b.date.localeCompare(a.date));

        if (items.length === 0) {
          showState("아직 등록된 리포트가 없습니다. DailyReport 폴더에 날짜별 파일을 올려주세요.");
          selectEl.innerHTML = "<option>리포트 없음</option>";
          return;
        }

        // 드롭다운 채우기
        selectEl.innerHTML = "";
        for (const it of items) {
          const opt = document.createElement("option");
          opt.value = it.name;
          opt.dataset.date = it.date;
          opt.textContent = labelFor(it.date);
          selectEl.appendChild(opt);
        }
        selectEl.disabled = false;

        // URL 해시(#2026-10-16)로 들어오면 해당 날짜, 아니면 최신 날짜
        const hashDate = location.hash.replace("#", "");
        let target = items.find(it => it.date === hashDate) || items[0];
        selectEl.value = target.name;
        loadReport(target.name);

        // 드롭다운 변경 시 해당 리포트 로드 + 해시 갱신
        selectEl.addEventListener("change", () => {
          const opt = selectEl.selectedOptions[0];
          if (!opt) return;
          loadReport(opt.value);
          history.replaceState(null, "", "#" + opt.dataset.date);
        });

      } catch (e) {
        showState("목록을 불러오지 못했습니다. 잠시 후 새로고침 해주세요. (" + e.message + ")");
      }
    }

    init();
  </script>
</body>
</html>
