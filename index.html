<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일에서 안 깨지도록 반응형 뷰포트 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데일리 증시 리포트</title>
  <!-- 카톡/슬랙 링크 미리보기용 메타 -->
  <meta property="og:title" content="데일리 증시 리포트" />
  <meta property="og:description" content="매일 업데이트되는 증시 요약 리포트" />
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e6e8ec;
      --muted: #9aa3af;
      --up: #ef4444;    /* 상승(한국식 빨강) */
      --down: #3b82f6;  /* 하락(파랑) */
      --accent: #f5c542;
      --border: #272b33;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
    header { padding: 16px 0 8px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .date { color: var(--muted); font-size: .9rem; }
    section { margin: 22px 0; }
    h2 { font-size: 1.1rem; margin: 0 0 10px; color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0;
    }
    .up { color: var(--up); font-weight: 600; }
    .down { color: var(--down); font-weight: 600; }
    ul { padding-left: 1.1em; margin: 8px 0; }
    li { margin: 4px 0; }
    footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📈 데일리 증시 리포트</h1>
      <div class="date">2026-10-16 기준</div>
    </header>

    <!-- ↓↓↓ 매일 이 아래 내용만 Claude로 뽑은 리포트로 교체하면 됩니다 ↓↓↓ -->

    <section>
      <h2>오늘의 한줄 요약</h2>
      <div class="card">
        여기에 증시 핵심 요약을 넣으세요. (예시 템플릿입니다)
      </div>
    </section>

    <section>
      <h2>주요 지수</h2>
      <div class="card">
        <ul>
          <li>KOSPI: <span class="up">+0.00%</span></li>
          <li>KOSDAQ: <span class="down">-0.00%</span></li>
          <li>S&amp;P 500: <span class="up">+0.00%</span></li>
        </ul>
      </div>
    </section>

    <section>
      <h2>특징주 / 이슈</h2>
      <div class="card">
        <ul>
          <li>항목 1</li>
          <li>항목 2</li>
        </ul>
      </div>
    </section>

    <!-- ↑↑↑ 여기까지 교체 ↑↑↑ -->

    <footer>
      자동 공유용 리포트 · 투자 판단의 책임은 본인에게 있습니다.
    </footer>
  </div>
</body>
</html>
